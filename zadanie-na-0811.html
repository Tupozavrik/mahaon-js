<!DOCTYPE html>
<html lang="ru">
    <script type="text/javascript"> 
        function counter(){
            var a = Math.random()*255;
            var b = Math.random()*255;
            var c = Math.random()*255;
            document.getElementById("meow1").style.backgroundColor = `rgb(${a}, ${b}, ${c})`;
           
        }
    </script>
<head>
    <title>Заголовок страницы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div style="text-align:center "><button onclick="counter()" id="meow1" style="width: 1000px; height: 200px;"  >click!</button></div>
</body>
</html>
